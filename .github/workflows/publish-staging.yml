# Rebuilds the site for /linden-dental and publishes it to the PSI app's staging area
# (stanventures-psi.fly.dev/linden-dental/) after every push to main, which includes every
# save in the hosted CMS at stanventures-psi.fly.dev/keystatic. Free on public repos.
name: Publish staging

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'keystatic.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish-staging.yml'
  workflow_dispatch:

# A newer save makes an in-flight publish pointless.
concurrency:
  group: publish-staging
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The lockfile is written on Windows; fall back to install if Linux-only optional deps are missing.
      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build for /linden-dental
        run: npx astro build --outDir dist-psi
        env:
          LINDEN_BASE: /linden-dental
          LINDEN_SITE: https://stanventures-psi.fly.dev
          PUBLIC_BOOKING_ENDPOINT: /api/linden/bookings
          PUBLIC_NOINDEX: '1'

      - name: Package
        run: tar -czf site.tgz -C dist-psi . && ls -lh site.tgz

      - name: Publish to PSI
        env:
          TOKEN: ${{ secrets.LINDEN_PUBLISH_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-linden-commit: $GITHUB_SHA" \
            -H "Content-Type: application/gzip" \
            --data-binary @site.tgz \
            https://stanventures-psi.fly.dev/api/linden/publish
